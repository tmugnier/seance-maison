<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séance">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1018" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Séance Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app shell — 3 tabs (Aujourd'hui / Activités / Semaine) above a fixed bottom bar; the timer is a full-screen layer */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --fg: #161827; --muted: #6B6F86;
  --line: #E1E3EC; --accent: #E8590C; --accent-soft: #FDE8DC;
  --rest: #0F8A6B; --rest-soft: #D9F2EA; --on-color: #FFFFFF;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1018; --surface: #191B27; --fg: #ECEDF5; --muted: #8C90A8; --line: #272A3A;
  --accent: #FF7A33; --accent-soft: #3A2215; --rest: #2BC79C; --rest-soft: #12322A; --on-color: #0F1018; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1018; --surface: #191B27; --fg: #ECEDF5; --muted: #8C90A8; --line: #272A3A;
  --accent: #FF7A33; --accent-soft: #3A2215; --rest: #2BC79C; --rest-soft: #12322A; --on-color: #0F1018; color-scheme: dark }

:root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; } /* défilement oui, zoom non */
button { touch-action: manipulation; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto;
}
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 0; }
.sub { color: var(--muted); margin: 0 0 20px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }
.label:first-child { margin-top: 0; }
.empty { border: 1.5px dashed var(--line); border-radius: 16px; background: var(--surface); padding: 28px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: .85rem; color: var(--muted); margin: 0 0 16px; }

/* Aujourd'hui */
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.chip small { display: block; color: var(--muted); font-size: .8rem; font-weight: 600; }
.chip strong { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.chip .bar { margin: 8px 0 0; }
.sugg { background: var(--accent-soft); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.sugg .kicker { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.sugg h2 { font-size: 1.9rem; font-weight: 800; }
.sugg .meta { color: var(--muted); }
.sugg-btns { display: flex; gap: 8px; margin-top: 10px; }
.sugg-btns .big { margin: 0; flex: 1; }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 0 16px; font-weight: 600; font-size: .95rem; }
.mini { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini .txt { flex: 1; min-width: 0; }
.mini .meta { color: var(--muted); font-size: .85rem; }
.mini button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .85rem; }

/* Semaine */
.progress { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.progress strong { font-family: var(--display); font-size: 1.6rem; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 16px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; }
.task .txt { flex: 1; min-width: 0; }
.task .meta { color: var(--muted); font-size: 0.85rem; }
.task.done h2 { text-decoration: line-through; color: var(--muted); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; padding: 0; color: var(--on-color); }
.task.done .check { background: var(--rest); border-color: var(--rest); }
.check svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.task:not(.done) .check svg { visibility: hidden; }
.play { border: 0; border-radius: 999px; background: var(--accent); color: var(--on-color); font-weight: 600; padding: 9px 16px; font-size: 0.9rem; flex: none; }
.del { flex: none; border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; }
.del.sure { background: #D63A2F; border-color: #D63A2F; color: #FFFFFF; }

/* Activités */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; color: var(--fg); display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.tile .ico { font-size: 1.8rem; }
.tile small { color: var(--muted); font-size: .85rem; }
.card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--fg); }
.card .txt { flex: 1; min-width: 0; }
.card .chev { color: var(--muted); font-size: 1.4rem; }
.card .meta { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 16px; font-size: 1rem; }
.settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.set { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
.set small { display: block; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.set .val { font-family: var(--display); font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0; }
.set .row { display: flex; justify-content: center; gap: 8px; }
.set button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 1.1rem; line-height: 1; }
.total { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
ol.exos { list-style: none; margin: 0; padding: 0; counter-reset: ex; display: flex; flex-direction: column; gap: 8px; }
ol.exos li { counter-increment: ex; display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
ol.exos li::before { content: counter(ex); font-family: var(--display); font-weight: 600; color: var(--accent); min-width: 1.2em; }
ol.exos li div { min-width: 0; }
ol.exos p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
.big { display: block; width: 100%; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-color); font: 600 1.1rem var(--body); padding: 16px; margin-top: 20px; }

.fait-ok { margin: 20px 0 10px; padding: 14px 16px; border-radius: 16px; background: var(--rest-soft); color: var(--rest); font-weight: 700; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: .95rem; max-width: calc(100% - 32px); text-align: center; }

/* Bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav button { appearance: none; border: 0; background: none; color: var(--muted); font: 500 0.75rem var(--body); letter-spacing: 0.02em;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; }
nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); }

/* Timer */
#timer { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#timer[data-phase="effort"] { background: var(--accent-soft); }
#timer[data-phase="rest"] { background: var(--rest-soft); }
.t-top { display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.t-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; min-height: 0; }
.t-phase { font-weight: 800; letter-spacing: 0.14em; font-size: 1rem; padding: 6px 14px; border-radius: 999px; background: var(--fg); color: var(--bg); }
#timer[data-phase="effort"] .t-phase { background: var(--accent); color: var(--on-color); }
#timer[data-phase="rest"] .t-phase { background: var(--rest); color: var(--on-color); }
.t-name { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 9vw, 3.2rem); line-height: 1.05; text-wrap: balance; margin: 8px 0 0; }
.t-time { font-family: var(--display); font-weight: 800; font-size: clamp(4.5rem, 26vw, 10rem); line-height: 1; font-variant-numeric: tabular-nums; }
.t-next { color: var(--muted); font-size: 1rem; }
.t-next b { color: var(--fg); }
.t-btns { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr; gap: 8px; }
.t-btns button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 16px 4px; font-weight: 600; font-size: 0.95rem; min-width: 0; }
.t-btns .main { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.t-confirm { display: flex; gap: 10px; }
.t-confirm button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 16px 8px; font-weight: 600; font-size: 1rem; }
.t-confirm #t-quit { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<main>
  <section data-tab="aujourdhui">
    <p class="note" id="save-note" hidden>Sauvegarde en ligne indisponible (pas de connexion ?)</p>
    <div class="chips" id="chips"></div>
    <div class="label">Reste cette semaine</div>
    <div id="reste"></div>
  </section>

  <section data-tab="activites" hidden>
    <div id="act-view"></div>
  </section>

  <section data-tab="semaine" hidden>
    <div class="progress"><strong id="week-count">0/0</strong><span class="sub" style="margin:0">faites cette semaine</span></div>
    <div class="bar"><i id="week-bar" style="width:0%"></i></div>
    <div class="stack" id="week-list"></div>
  </section>
</main>

<nav role="tablist" aria-label="Navigation">
  <button id="nav-aujourdhui" role="tab" data-go="aujourdhui" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button id="nav-activites" role="tab" data-go="activites" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Activités</button>
  <button id="nav-semaine" role="tab" data-go="semaine" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
</nav>

<div id="toast" class="toast" role="status" hidden></div>

<div id="timer" hidden data-phase="prep">
  <div class="t-top"><span id="t-seance">Pecs</span><span id="t-round">Tour 1/2</span></div>
  <div class="t-mid">
    <span class="t-phase" id="t-phase">PRÉPARE-TOI</span>
    <p class="t-name" id="t-name">Pompes classiques</p>
    <div class="t-time" id="t-time">5</div>
    <div class="t-next" id="t-next"></div>
  </div>
  <div class="t-btns" id="t-btns">
    <button id="t-stop">Arrêter</button>
    <button id="t-back">Revenir</button>
    <button id="t-pause" class="main">Pause</button>
    <button id="t-skip">Passer</button>
  </div>
  <div class="t-confirm" id="t-confirm" hidden>
    <button id="t-cancel">Continuer</button>
    <button id="t-quit">Quitter la séance</button>
  </div>
</div>

<script>
/* =====================================================================
   CATALOGUE — pour ajouter une activité ou une catégorie, c'est ici.
   type "circuit" : séance avec timer (effort / récup / tours / exos)
   type "sortie"  : activité à cocher (info = ce qu'on fait)
   parSemaine     : combien de fois par semaine (1 par défaut)
   famille        : "pousser" / "tirer" / "autre" (sert à la suggestion du jour)
   ===================================================================== */
const CATEGORIES = [
  { id: "muscu", nom: "Musculation", icone: "💪", desc: "Séances avec timer" },
  { id: "ext", nom: "Extérieur", icone: "🌳", desc: "Vélo, quad, course" }
];

const ACTIVITES = [
  { id: "pecs", nom: "Pecs", cat: "muscu", type: "circuit", famille: "pousser", materiel: "Poids du corps", effort: 30, recup: 30, tours: 2,
    echauffement: "Grands cercles de bras, ouvre et ferme la poitrine, puis 5 pompes sur les genoux.", exos: [
    ["Pompes classiques", "Mains largeur d'épaules, descente contrôlée."],
    ["Pompes mains décollées", "Poitrine au sol, décolle les mains, puis repousse."],
    ["Pompes serrées", "Mains rapprochées, pour les triceps."],
    ["Pompes lentes", "Descends en 5 secondes, remonte normalement."],
    ["Pompes touché d'épaule", "En haut, touche l'épaule opposée en alternant."]
  ]},
  { id: "dos", nom: "Dos", cat: "muscu", type: "circuit", famille: "tirer", materiel: "Barre de traction + haltère", effort: 30, recup: 30, tours: 5,
    echauffement: "Rotations d'épaules, rapproche les omoplates, puis suspends-toi 10 s à la barre.", exos: [
    ["Tractions", "Bras tendus, tire jusqu'à passer le menton au-dessus de la barre, redescends contrôlé."],
    ["Tractions", "Bras tendus, tire jusqu'à passer le menton au-dessus de la barre, redescends contrôlé."],
    ["Rowing haltère", "Buste penché, dos droit, tire l'haltère vers la hanche en serrant l'omoplate."]
  ]},
  { id: "epaules", nom: "Épaules", cat: "muscu", type: "circuit", famille: "pousser", materiel: "Haltères", effort: 45, recup: 15, tours: 1,
    echauffement: "Cercles de bras avant/arrière, rotations d'épaules, puis 10 élévations sans poids.", exos: [
    ["Développé debout", "Pousse les deux haltères au-dessus de la tête."],
    ["Élévations latérales", "Les deux bras en même temps, coudes légèrement fléchis, monte sur les côtés."],
    ["Développé debout", "Pousse les deux haltères au-dessus de la tête."],
    ["Élévations frontales alternées", "Bras tendu devant, un côté puis l'autre."],
    ["Développé debout", "Pousse les deux haltères au-dessus de la tête."],
    ["Oiseau debout", "Buste penché à 45°, dos droit, écarte les bras sur les côtés."],
    ["Élévations latérales", "Les deux bras en même temps, coudes légèrement fléchis, monte sur les côtés."],
    ["Élévations frontales marteau", "Paumes face à face, bras devant."],
    ["Élévations frontales alternées", "Bras tendu devant, un côté puis l'autre."],
    ["Élévations latérales", "Les deux bras en même temps, coudes légèrement fléchis, monte sur les côtés."],
    ["Oiseau debout", "Buste penché à 45°, dos droit, écarte les bras sur les côtés."]
  ]},
  { id: "biceps", nom: "Biceps", cat: "muscu", type: "circuit", famille: "tirer", materiel: "Haltères", effort: 45, recup: 15, tours: 2,
    echauffement: "Rotations des poignets, flexions des bras sans poids, puis 10 curls très légers.", exos: [
    ["Curl classique", "Paumes vers le haut, coudes fixes."],
    ["Curl marteau", "Paumes face à face."],
    ["Curl inversé", "Paumes vers le bas, pour les avant-bras."],
    ["Curl prise large", "Bras légèrement écartés sur les côtés."],
    ["Curl coudes en arrière", "Coudes un peu derrière le corps, pour l'étirement."]
  ]},
  { id: "triceps", nom: "Triceps", cat: "muscu", type: "circuit", famille: "pousser", materiel: "Haltères + machine à dips", effort: 45, recup: 15, tours: 2,
    echauffement: "Cercles de bras, extensions des bras au-dessus de la tête, puis 5 pompes serrées sur les genoux.", exos: [
    ["Dips à la machine", "Mains sur les barres, buste droit, descends jusqu'à coudes à 90° puis repousse."],
    ["Kickbacks", "Buste penché, tends les bras vers l'arrière."],
    ["Pompes serrées", "Mains rapprochées, sur les pieds ou les genoux."],
    ["Kickbacks", "Buste penché, tends les bras vers l'arrière."],
    ["Pompes serrées", "Mains rapprochées, sur les pieds ou les genoux."]
  ]},
  { id: "trapezes", nom: "Trapèzes", cat: "muscu", type: "circuit", famille: "tirer", materiel: "Haltères", effort: 45, recup: 15, tours: 10,
    echauffement: "Haussements d'épaules sans poids, rotations d'épaules avant/arrière.", exos: [
    ["Shrugs", "Un haltère dans chaque main, bras tendus : monte les épaules vers les oreilles, tiens 1 s, redescends lentement."]
  ]},
  { id: "cou", nom: "Cou", cat: "muscu", type: "circuit", famille: "autre", materiel: "Poids du corps", effort: 30, recup: 0, tours: 3,
    echauffement: "Oui / non lentement, oreille vers l'épaule de chaque côté, sans forcer.", exos: [
    ["Pont de nuque", "Sur le dos, lève le bassin et mets ton poids sur l'arrière de la tête. Monte en douceur."],
    ["Poussée latérale (gauche)", "Main sur le côté gauche de la tête : pousse la tête contre la main, sans bouger."],
    ["Poussée latérale (droite)", "Même chose côté droit."],
    ["Poussée avant", "Allongé sur le dos, lève la tête et pousse le front contre ta main, sans bouger."]
  ]},
  { id: "velo", nom: "Vélo", cat: "ext", type: "sortie", materiel: "Vélo", info: "Sortie d'environ 5 km",
    desc: "Fais ta sortie (avec ton appli GPS si tu veux), puis coche-la ici." },
  { id: "quad", nom: "Quad", cat: "ext", type: "sortie", materiel: "Quad", info: "Tour d'environ 15 km",
    desc: "Fais ton tour, puis coche-le ici." },
  { id: "course", nom: "Course fractionnée", cat: "ext", type: "circuit", famille: "autre", materiel: "Chaussures de course",
    warm: 300, effort: 60, recup: 60, tours: 8, recupTxt: "Trotte doucement pour récupérer.",
    echauffement: "Footing très tranquille pendant 5 minutes, tu dois pouvoir parler facilement.", exos: [
    ["Course rapide", "Allure soutenue : tu peux dire quelques mots, pas tenir une conversation."]
  ]}
];
const act = id => ACTIVITES.find(a => a.id === id);
const parCat = c => ACTIVITES.filter(a => a.cat === c);
const objectif = a => a.parSemaine || 1;

/* ---------- État (réglages + semaine), sauvegardé en ligne ---------- */
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function saveLocal() { try { localStorage.setItem("etat", JSON.stringify(etat)); } catch (e) {} }
let etat = load("etat", null) || { reglages: load("reglages", {}), semaines: load("semaines", {}), dernier: null };
normaliser();
function normaliser() {
  etat.reglages = etat.reglages || {}; etat.semaines = etat.semaines || {};
  // anciennes données : une liste d'ids par semaine → un compteur par activité
  for (const k in etat.semaines) if (Array.isArray(etat.semaines[k])) {
    const o = {}; etat.semaines[k].forEach(id => o[id] = 1); etat.semaines[k] = o;
  }
}
function save() { saveLocal(); sync(); }

/* Sauvegarde en ligne (Supabase, API REST) : une seule ligne dans la table "etat" */
const SB_URL = "https://fuoosyufzvjayfybsylx.supabase.co";
const SB_KEY = "sb_publishable_0Eke7xhMf0pFTJkwI_TdHg_19Ru_UXI"; // clé publique (publishable), prévue pour le navigateur
const SB_ID = "c9f7ade0fa426c415758a0cdeac32550";
const SB_HEADERS = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
let cloudOk = false, cloudQueue = Promise.resolve();
async function envoyer(data) {
  const r = await fetch(SB_URL + "/rest/v1/etat", {
    method: "POST",
    headers: Object.assign({ Prefer: "resolution=merge-duplicates,return=minimal" }, SB_HEADERS),
    body: JSON.stringify({ id: SB_ID, data, maj: new Date().toISOString() })
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
function sync() {
  if (!cloudOk) return;
  const data = { reglages: etat.reglages, semaines: etat.semaines, dernier: etat.dernier || null, maj: new Date().toISOString() };
  const note = document.getElementById("save-note");
  cloudQueue = cloudQueue.then(() => envoyer(data)).then(() => { note.hidden = true; }).catch(() => { note.hidden = false; });
}
async function connecterCloud() {
  const note = document.getElementById("save-note");
  const t = setTimeout(() => { note.hidden = false; }, 10000);
  try {
    const r = await fetch(SB_URL + "/rest/v1/etat?id=eq." + SB_ID + "&select=data", { headers: SB_HEADERS, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json();
    clearTimeout(t);
    cloudOk = true;
    if (rows.length) {
      const d = rows[0].data || {};
      etat = { reglages: d.reglages || {}, semaines: d.semaines || {}, dernier: d.dernier || null };
      normaliser(); saveLocal();
    } else sync(); // première fois : on envoie ce qu'il y a sur ce téléphone
    note.hidden = true;
    renderTout();
  } catch (e) { clearTimeout(t); note.hidden = false; }
}

/* ---------- Outils ---------- */
function cfg(a) { return Object.assign({ effort: a.effort, recup: a.recup, tours: a.tours }, etat.reglages[a.id] || {}); }
function lundi(d = new Date()) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function cleSemaine() { const l = lundi(); return l.getFullYear() + "-" + String(l.getMonth()+1).padStart(2,"0") + "-" + String(l.getDate()).padStart(2,"0"); }
function semaine() { return etat.semaines[cleSemaine()] || {}; }
const nbFait = id => semaine()[id] || 0;
const complet = a => nbFait(a.id) >= objectif(a);
function dureeSec(a) { const c = cfg(a), n = a.exos.length * c.tours; return n * c.effort + (n - 1) * c.recup; }
function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return s ? m + " min " + String(s).padStart(2,"0") : m + " min"; }
const meta = a => a.type === "sortie" ? a.info : fmt(dureeSec(a));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const bouton = a => a.type === "sortie" ? `<button class="play" data-done="${a.id}">✓ Fait</button>` : `<button class="play" data-start="${a.id}">▶ Lancer</button>`;
function score(liste) {
  const total = liste.reduce((n, a) => n + objectif(a), 0);
  const fait = liste.reduce((n, a) => n + Math.min(nbFait(a.id), objectif(a)), 0);
  return { fait, total };
}

function ajouter(id, delta) {
  const k = cleSemaine(), s = Object.assign({}, etat.semaines[k] || {});
  s[id] = Math.max(0, (s[id] || 0) + delta);
  if (!s[id]) delete s[id];
  etat.semaines[k] = s;
  const a = act(id);
  if (delta > 0 && a && a.cat === "muscu") etat.dernier = id;
  save(); renderTout();
  if (a) toast(delta > 0 ? `✓ ${a.nom} coché pour cette semaine` : `${a.nom} retiré`);
}
let toastTimer = null;
function toast(txt) {
  const t = document.getElementById("toast");
  t.textContent = txt; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------- Aujourd'hui : résumé + suggestion du jour ---------- */
let decalage = 0;
function suggestions() {
  const muscu = parCat("muscu"), ordre = muscu.map(a => a.id);
  const i = ordre.indexOf(etat.dernier);
  const tour = i < 0 ? muscu : [...muscu.slice(i + 1), ...muscu.slice(0, i + 1)];
  const derniereFamille = etat.dernier ? act(etat.dernier)?.famille : null;
  let restes = tour.filter(a => !complet(a));
  // on évite d'enchaîner deux fois la même famille (pousser / tirer)
  restes = [...restes.filter(a => a.famille !== derniereFamille || a.famille === "autre"), ...restes.filter(a => a.famille === derniereFamille && a.famille !== "autre")];
  const autres = ACTIVITES.filter(a => a.cat !== "muscu" && !complet(a));
  return [...restes, ...autres];
}
function renderAujourdhui() {
  document.getElementById("chips").innerHTML = CATEGORIES.map(c => {
    const { fait, total } = score(parCat(c.id));
    return `<div class="chip"><small>${c.icone} ${esc(c.nom)}</small><strong>${fait}/${total}</strong>
      <div class="bar"><i style="width:${total ? fait / total * 100 : 0}%"></i></div></div>`;
  }).join("");
  const reste = ACTIVITES.filter(a => !complet(a));
  document.getElementById("reste").innerHTML = reste.length
    ? `<div>${reste.map(a => `<div class="mini"><div class="txt"><b>${esc(a.nom)}</b><div class="meta">${esc(meta(a))}</div></div>
        <button data-${a.type === "sortie" ? "done" : "start"}="${a.id}">${a.type === "sortie" ? "✓ Fait" : "▶ Lancer"}</button></div>`).join("")}</div>`
    : `<div class="empty"><b>Semaine bouclée 🎉</b>Tout est fait. Repos bien mérité jusqu'à lundi.</div>`;
}

/* ---------- Semaine : tout, à cocher / retirer ---------- */
function renderSemaine() {
  const { fait, total } = score(ACTIVITES);
  document.getElementById("week-count").textContent = fait + "/" + total;
  document.getElementById("week-bar").style.width = (total ? fait / total * 100 : 0) + "%";
  document.getElementById("week-list").innerHTML = CATEGORIES.map(c => `<div class="label">${c.icone} ${esc(c.nom)}</div>` + parCat(c.id).map(a => {
    const ok = complet(a), n = nbFait(a.id), obj = objectif(a);
    return `<div class="task${ok ? " done" : ""}">
      <button class="check" data-toggle="${a.id}" aria-label="${ok ? "Décocher" : "Cocher"} ${esc(a.nom)}">${CHECK}</button>
      <div class="txt"><h2>${esc(a.nom)}</h2><div class="meta">${esc(meta(a))}${obj > 1 ? ` · ${n}/${obj}` : ""}</div></div>
      ${ok ? `<button class="del" data-del="${a.id}">Retirer</button>` : bouton(a)}
    </div>`;
  }).join("")).join("");
}
let delTimer = null;
function retirer(b) {
  if (!b.classList.contains("sure")) {
    document.querySelectorAll(".del.sure").forEach(x => { x.classList.remove("sure"); x.textContent = "Retirer"; });
    b.classList.add("sure"); b.textContent = "Confirmer";
    clearTimeout(delTimer);
    delTimer = setTimeout(() => { b.classList.remove("sure"); b.textContent = "Retirer"; }, 3000);
    return;
  }
  ajouter(b.dataset.del, -1);
}

/* ---------- Activités : catégories → liste → fiche ---------- */
let vue = { cat: null, id: null };
function renderActivites() {
  const el = document.getElementById("act-view");
  if (vue.id) {
    const a = act(vue.id), c = CATEGORIES.find(x => x.id === a.cat);
    const back = `<button class="back" data-vue="${a.cat}">‹ ${esc(c.nom)}</button>`;
    if (a.type === "sortie") {
      el.innerHTML = `${back}<h1>${esc(a.nom)}</h1><p class="sub">${esc(a.info)}</p><p>${esc(a.desc)}</p>
        ${complet(a)
          ? `<p class="fait-ok">✓ Fait cette semaine</p><button class="ghost" style="padding:14px 16px" data-toggle="${a.id}">Annuler</button>`
          : `<button class="big" data-done="${a.id}">✓ Marquer comme fait</button>`}`;
      return;
    }
    const k = cfg(a);
    const set = (key, lab, unit) => `<div class="set"><small>${lab}</small><div class="val">${k[key]}${unit}</div>
      <div class="row"><button data-adj="${key}" data-d="-1" aria-label="Moins">−</button><button data-adj="${key}" data-d="1" aria-label="Plus">+</button></div></div>`;
    el.innerHTML = `${back}<h1>${esc(a.nom)}</h1><p class="sub">${esc(a.materiel)} · circuit de ${a.exos.length} exercice${a.exos.length > 1 ? "s" : ""}</p>
      <div class="settings">${set("effort","Effort","s")}${set("recup","Récup","s")}${set("tours","Tours","")}</div>
      <p class="total">Durée : ${fmt(dureeSec(a))} · ${a.exos.length * k.tours} séries · + ${fmt(a.warm || 60)} d'échauffement</p>
      <div class="label">Exercices, dans l'ordre</div>
      <ol class="exos">${a.exos.map(e => `<li><div><b>${esc(e[0])}</b><p>${esc(e[1])}</p></div></li>`).join("")}</ol>
      <button class="big" data-start="${a.id}">▶ Lancer la séance</button>`;
    return;
  }
  if (vue.cat) {
    const c = CATEGORIES.find(x => x.id === vue.cat);
    el.innerHTML = `<button class="back" data-vue="">‹ Activités</button><h1>${c.icone} ${esc(c.nom)}</h1><p class="sub">${esc(c.desc)}</p>
      <div class="stack">${parCat(c.id).map(a => {
        const k = a.type === "circuit" ? cfg(a) : null;
        const info = a.type === "sortie" ? a.info
          : `${a.exos.length} exo${a.exos.length > 1 ? "s" : ""} · ${k.effort}s / ${k.recup}s · ${k.tours} tour${k.tours > 1 ? "s" : ""} · ${fmt(dureeSec(a))}`;
        return `<button class="card" data-fiche="${a.id}"><div class="txt"><h2>${esc(a.nom)}${complet(a) ? " ✓" : ""}</h2>
          <div class="meta">${esc(info)}</div></div><span class="chev">›</span></button>`;
      }).join("")}</div>`;
    return;
  }
  el.innerHTML = `<h1>Activités</h1><p class="sub">Choisis une catégorie.</p>
    <div class="tiles">${CATEGORIES.map(c => {
      const { fait, total } = score(parCat(c.id));
      return `<button class="tile" data-vue="${c.id}"><span class="ico">${c.icone}</span><h2>${esc(c.nom)}</h2>
        <small>${parCat(c.id).length} activités · ${fait}/${total} cette semaine</small></button>`;
    }).join("")}</div>`;
}
function ajuster(key, d) {
  const a = act(vue.id), k = cfg(a);
  const lim = { effort: [10, 120, 5], recup: [0, 120, 5], tours: [1, 10, 1] }[key];
  k[key] = Math.min(lim[1], Math.max(lim[0], k[key] + d * lim[2]));
  etat.reglages[a.id] = k; save(); renderTout();
}

function renderTout() { renderAujourdhui(); renderSemaine(); renderActivites(); }

/* ---------- Son ---------- */
let audio = null;
function bip(freq = 880, dur = 0.15, vol = 0.35) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
/* Sur iPhone : le son web est coupé par le mode silencieux et doit être "débloqué" par un appui.
   On passe la session audio en mode lecture et on lance un son muet en boucle pendant la séance. */
let muet = null;
function wavMuet() {
  const n = 4000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  let bin = ""; new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
  return "data:audio/wav;base64," + btoa(bin);
}
function debloquerSon() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  try {
    if (!muet) { muet = new Audio(wavMuet()); muet.loop = true; muet.setAttribute("playsinline", ""); }
    muet.play().catch(() => {});
  } catch (e) {}
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    const b = audio.createBuffer(1, 1, 22050), src = audio.createBufferSource();
    src.buffer = b; src.connect(audio.destination); src.start(0);
  } catch (e) {}
  bip(660, 0.05, 0.01);
}
function couperMuet() { try { muet && muet.pause(); } catch (e) {} }

/* ---------- Timer ---------- */
const T = id => document.getElementById(id);
let run = null, wake = null;
function etapes(a) {
  const c = cfg(a), out = [{ phase: "warm", sec: a.warm || 60, ex: 0, tour: 1 }, { phase: "prep", sec: 5, ex: 0, tour: 1 }];
  for (let t = 1; t <= c.tours; t++) a.exos.forEach((e, i) => {
    out.push({ phase: "effort", sec: c.effort, ex: i, tour: t });
    const last = t === c.tours && i === a.exos.length - 1;
    if (!last && c.recup > 0) out.push({ phase: "rest", sec: c.recup, ex: i, tour: t });
  });
  return out;
}
async function garderEcran() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) { wake = null; } }
function lancer(id) {
  const a = act(id); if (!a || a.type !== "circuit") return;
  debloquerSon();
  run = { s: a, steps: etapes(a), i: 0, end: 0, left: 0, paused: false, debut: Date.now(), lastSec: null };
  T("timer").hidden = false; T("t-confirm").hidden = true; T("t-btns").hidden = false;
  garderEcran(); demarrerEtape();
}
function demarrerEtape() {
  const st = run.steps[run.i];
  run.end = performance.now() + st.sec * 1000; run.lastSec = null;
  const s = run.s, c = cfg(s), ex = s.exos[st.ex];
  T("timer").dataset.phase = st.phase;
  T("t-seance").textContent = s.nom;
  T("t-round").textContent = "Tour " + st.tour + "/" + c.tours + " · Exo " + (st.ex + 1) + "/" + s.exos.length;
  T("t-phase").textContent = st.phase === "effort" ? "EFFORT" : st.phase === "rest" ? "RÉCUP" : st.phase === "warm" ? "ÉCHAUFFEMENT" : "PRÉPARE-TOI";
  const nextIdx = run.steps.findIndex((x, j) => j > run.i && x.phase === "effort");
  const shownEx = st.phase === "rest" && run.steps[nextIdx] ? run.steps[nextIdx].ex : st.ex;
  T("t-name").textContent = s.exos[shownEx][0];
  if (st.phase === "effort") {
    const nx = run.steps[nextIdx];
    T("t-next").innerHTML = nx ? "Ensuite : <b>" + esc(s.exos[nx.ex][0]) + "</b>" : "<b>Dernier exercice !</b>";
  } else T("t-next").innerHTML = st.phase === "rest" ? esc(s.recupTxt || "Prochain exercice") : esc(ex[1]);
  if (st.phase === "warm") {
    T("t-name").textContent = "Échauffement";
    T("t-next").textContent = s.echauffement || "Cercles de bras, rotations d'épaules, quelques pompes faciles.";
  }
  if (st.phase === "effort") bip(1046, 0.35, 0.45); else if (st.phase === "rest") bip(523, 0.35, 0.4);
  T("t-pause").textContent = "Pause"; run.paused = false;
  tick();
}
function tick() {
  if (!run || run.paused) return;
  const ms = run.end - performance.now(), sec = Math.max(0, Math.ceil(ms / 1000));
  if (sec !== run.lastSec) {
    T("t-time").textContent = sec;
    if (sec > 0 && sec <= 3 && run.lastSec !== null) bip(784, 0.08, 0.3);
    run.lastSec = sec;
  }
  if (ms <= 0) { suivant(); return; }
  run.raf = requestAnimationFrame(tick);
}
function suivant() {
  cancelAnimationFrame(run.raf);
  run.i++;
  if (run.i >= run.steps.length) return finir();
  demarrerEtape();
}
function finir() {
  const s = run.s, duree = Math.round((Date.now() - run.debut) / 1000);
  decalage = 0; ajouter(s.id, 1);
  bip(1046, 0.2, 0.4); setTimeout(() => bip(1318, 0.4, 0.4), 220);
  T("timer").dataset.phase = "rest";
  T("t-phase").textContent = "TERMINÉ"; T("t-name").textContent = s.nom + " ✅";
  T("t-time").textContent = "Bravo";
  T("t-next").textContent = "Séance cochée pour cette semaine.";
  T("t-round").textContent = fmt(duree);
  T("t-btns").hidden = true; T("t-confirm").hidden = false;
  T("t-cancel").hidden = true; T("t-quit").textContent = "Retour";
  run.fini = true;
}
function fermer() {
  if (run) cancelAnimationFrame(run.raf);
  couperMuet();
  run = null; T("timer").hidden = true; T("t-cancel").hidden = false; T("t-quit").textContent = "Quitter la séance";
  try { wake && wake.release(); } catch (e) {} wake = null;
}
T("t-pause").onclick = () => {
  if (!run) return;
  if (run.paused) { run.end = performance.now() + run.left; run.paused = false; T("t-pause").textContent = "Pause"; tick(); }
  else { run.left = run.end - performance.now(); run.paused = true; cancelAnimationFrame(run.raf); T("t-pause").textContent = "Reprendre"; }
};
T("t-skip").onclick = () => run && suivant();
/* Revenir : recommence l'étape en cours ; si on vient juste de la commencer (moins de 3 s), revient à l'exercice d'avant */
T("t-back").onclick = () => {
  if (!run || run.fini) return;
  const st = run.steps[run.i];
  const reste = run.paused ? run.left : run.end - performance.now();
  const ecoule = st.sec * 1000 - reste;
  cancelAnimationFrame(run.raf);
  if (ecoule < 3000 && run.i > 0) {
    run.i--;
    while (run.i > 0 && run.steps[run.i].phase === "rest") run.i--;
  }
  demarrerEtape();
};
T("t-stop").onclick = () => { if (!run) return; if (!run.paused) T("t-pause").click(); T("t-btns").hidden = true; T("t-confirm").hidden = false; };
T("t-cancel").onclick = () => { T("t-confirm").hidden = true; T("t-btns").hidden = false; T("t-pause").click(); };
T("t-quit").onclick = fermer;
document.addEventListener("visibilitychange", () => { if (run && !document.hidden) { garderEcran(); try { audio && audio.resume(); } catch (e) {} } });
T("timer").addEventListener("pointerdown", () => { try { audio && audio.state !== "running" && audio.resume(); } catch (e) {} });

/* ---------- Navigation ---------- */
const TABS = ["aujourdhui", "activites", "semaine"];
function show(name) {
  if (!TABS.includes(name)) name = "aujourdhui";
  document.querySelectorAll("[data-tab]").forEach(s => s.hidden = s.dataset.tab !== name);
  document.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-selected", b.dataset.go === name));
  if (name === "activites") { vue = { cat: null, id: null }; renderActivites(); }
  try { localStorage.setItem("tab", name); } catch (e) {}
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go) show(d.go);
  else if (d.start) lancer(d.start);
  else if (d.done) { decalage = 0; ajouter(d.done, 1); }
  else if (d.toggle) { const a = act(d.toggle); ajouter(a.id, complet(a) ? -1 : 1); }
  else if (d.del) retirer(b);
  else if (d.autre) { decalage++; renderAujourdhui(); }
  else if (d.vue !== undefined) { vue = { cat: d.vue || null, id: null }; renderActivites(); window.scrollTo(0, 0); }
  else if (d.fiche) { vue.id = d.fiche; renderActivites(); window.scrollTo(0, 0); }
  else if (d.adj) ajuster(d.adj, +d.d);
});

// Pas de zoom à deux doigts (iPhone)
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
["touchstart", "touchmove"].forEach(ev => document.addEventListener(ev, e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false }));
let dernierTap = 0; // pas de zoom au double-tap
document.addEventListener("touchend", e => {
  const t = Date.now();
  if (t - dernierTap < 350 && !e.target.closest("button")) e.preventDefault();
  dernierTap = t;
}, { passive: false });

renderTout();
connecterCloud();
