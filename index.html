<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séance">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1018" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Séance Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app shell — 3 tabs (Aujourd'hui / Activités / Semaine) above a fixed bottom bar; the timer is a full-screen layer */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --fg: #161827; --muted: #6B6F86;
  --line: #E1E3EC; --accent: #E8590C; --accent-soft: #FDE8DC;
  --rest: #0F8A6B; --rest-soft: #D9F2EA; --on-color: #FFFFFF;
  --fig: #CBCFDA; --fig-clair: #E4E7EE; --fig-peau: #EEF0F4; --fig-trait: #B7BCCB; --actif-clair: #FF9A5C; --actif-fonce: #C9440A;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1018; --surface: #191B27; --fg: #ECEDF5; --muted: #8C90A8; --line: #272A3A;
  --accent: #FF7A33; --accent-soft: #3A2215; --rest: #2BC79C; --rest-soft: #12322A; --on-color: #0F1018;
  --fig: #3A3E52; --fig-clair: #50556C; --fig-peau: #262938; --fig-trait: #15161F; --actif-clair: #FFA066; --actif-fonce: #D9500F; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1018; --surface: #191B27; --fg: #ECEDF5; --muted: #8C90A8; --line: #272A3A;
  --accent: #FF7A33; --accent-soft: #3A2215; --rest: #2BC79C; --rest-soft: #12322A; --on-color: #0F1018;
  --fig: #3A3E52; --fig-clair: #50556C; --fig-peau: #262938; --fig-trait: #15161F; --actif-clair: #FFA066; --actif-fonce: #D9500F; color-scheme: dark }

:root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; } /* défilement oui, zoom non */
button { touch-action: manipulation; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto;
}
h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 0; }
.sub { color: var(--muted); margin: 0 0 20px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }
.label:first-child { margin-top: 0; }
.empty { border: 1.5px dashed var(--line); border-radius: 16px; background: var(--surface); padding: 28px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--display); font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: .85rem; color: var(--muted); margin: 0 0 16px; }

/* Aujourd'hui */
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.chip small { display: block; color: var(--muted); font-size: .8rem; font-weight: 600; }
.chip strong { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.chip .bar { margin: 8px 0 0; }
.sugg { background: var(--accent-soft); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.sugg .kicker { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.sugg h2 { font-size: 1.9rem; font-weight: 800; }
.sugg .meta { color: var(--muted); }
.sugg-btns { display: flex; gap: 8px; margin-top: 10px; }
.sugg-btns .big { margin: 0; flex: 1; }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 0 16px; font-weight: 600; font-size: .95rem; }
.mini { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini .txt { flex: 1; min-width: 0; }
.mini .meta { color: var(--muted); font-size: .85rem; }
.mini button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .85rem; }

/* Plan trail (Aujourd'hui + catégorie Trail) */
.plan { display: flex; flex-direction: column; gap: 4px; width: 100%; box-sizing: border-box; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 0 0 16px; font-size: .95rem; }
.plan-k { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.plan h2 { font-size: 1.1rem; }
.plan-s { color: var(--muted); font-size: .9rem; }
.plan-l { margin-top: 2px; }
.infos { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
details.info { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.info summary { padding: 12px 0; font-weight: 600; cursor: pointer; }
details.info ul { margin: 0 0 12px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; }
details.info p { margin: 0 0 12px; font-size: .92rem; }

/* Semaine */
.progress { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.progress strong { font-family: var(--display); font-size: 1.6rem; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 16px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; }
.task .txt { flex: 1; min-width: 0; }
.task .meta { color: var(--muted); font-size: 0.85rem; }
.task.done h2 { text-decoration: line-through; color: var(--muted); }
.task.off h2 { color: var(--muted); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: grid; place-items: center; padding: 0; color: var(--on-color); }
.task.done .check { background: var(--rest); border-color: var(--rest); }
.check svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.task:not(.done) .check svg { visibility: hidden; }
.play { border: 0; border-radius: 999px; background: var(--accent); color: var(--on-color); font-weight: 600; padding: 9px 16px; font-size: 0.9rem; flex: none; }
.del { flex: none; border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; }
.del.sure { background: #D63A2F; border-color: #D63A2F; color: #FFFFFF; }
.acts { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 6px; } /* Lancer / Fait au-dessus de « −1 » */
.compteur { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Activités */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; color: var(--fg); display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
.tile .ico { font-size: 1.8rem; }
.tile small { color: var(--muted); font-size: .85rem; }
.card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--fg); }
.card .txt { flex: 1; min-width: 0; }
.card .chev { color: var(--muted); font-size: 1.4rem; }
.card .meta { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 16px; font-size: 1rem; }
.settings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.set { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
.set small { display: block; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.set .val { font-family: var(--display); font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0; }
.set .row { display: flex; justify-content: center; gap: 8px; }
.set button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 1.1rem; line-height: 1; }
.total { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
ol.exos { list-style: none; margin: 0; padding: 0; counter-reset: ex; display: flex; flex-direction: column; gap: 8px; }
ol.exos li { counter-increment: ex; display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
ol.exos li::before { content: counter(ex); font-family: var(--display); font-weight: 600; color: var(--accent); min-width: 1.2em; }
ol.exos li div { min-width: 0; flex: 1; }
.ex-photo { flex: none; align-self: flex-start; width: 72px; height: 48px; object-fit: cover; border-radius: 8px; background: #FFFFFF; border: 1px solid var(--line); }
ol.exos p { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; }
.big { display: block; width: 100%; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-color); font: 600 1.1rem var(--body); padding: 16px; margin-top: 20px; }

.fait-ok { margin: 20px 0 10px; padding: 14px 16px; border-radius: 16px; background: var(--rest-soft); color: var(--rest); font-weight: 700; text-align: center; }
/* Message « sauvegarde indisponible » : jamais affiché (la synchro réessaie toute seule) */
#save-note { display: none !important; }
/* Accueil v2 : liste de la semaine, silhouettes, feuille de réglages */
.tete-sem { margin-bottom: 14px; }
.tete-sem .sub { margin: 0 0 2px; font-size: .85rem; font-weight: 600; }
.cpt-h { font: 600 1.1rem var(--body); color: var(--muted); margin-left: 4px; }
.cpt-h b { color: var(--accent); font-family: var(--display); font-size: 1.45rem; }
.carte-liste { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 0 14px; }
.ls-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ls-row:last-child { border-bottom: 0; }
.ls-row .nom { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; color: var(--fg); font: inherit; }
.ls-row .nom b { display: block; font-size: 1.05rem; }
.ls-row .nom small { color: var(--muted); font-size: .85rem; }
.ls-row.fait .nom b { text-decoration: line-through; color: var(--muted); }
.rond { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-color); display: grid; place-items: center; padding: 0; font: 700 1.15rem var(--body); }
.rond svg { width: 18px; height: 18px; fill: currentColor; margin-left: 2px; }
.vign { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; }
.vign svg { width: 48px; height: 48px; }
.vign.ico svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fig .m { fill: url(#g-muscle); stroke: var(--fig-trait); stroke-width: .7; stroke-linejoin: round; }
.fig .m.doux { opacity: .75; }
.fig .p { fill: var(--fig-peau); stroke: var(--fig-trait); stroke-width: .5; }
.fig .on { fill: url(#g-actif); opacity: 1; }
details.autres { margin-top: 16px; }
details.autres summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .9rem; padding: 6px 0 10px; list-style: none; }
details.autres summary::-webkit-details-marker { display: none; }
details.autres summary::after { content: " ›"; }
details.autres[open] summary::after { content: " ⌄"; }
.voile { position: fixed; inset: 0; z-index: 25; background: rgba(6, 7, 12, .5); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: 0 -12px 40px rgba(0, 0, 0, .25); }
.poignee { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font: 800 1.6rem/1.1 var(--display); }
.duo-fig { display: flex; justify-content: center; gap: 18px; margin: 10px 0 12px; }
.duo-fig figure { margin: 0; text-align: center; }
.duo-fig svg { width: 104px; height: 180px; }
.duo-fig figcaption { font-size: .7rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.bascule { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.bascule input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; cursor: pointer; margin: 0; flex: none; }
.bascule input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.bascule input:checked { background: var(--rest); }
.bascule input:checked::after { transform: translateX(20px); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: .95rem; max-width: calc(100% - 32px); text-align: center; }

/* Programme visuel : anneau, semaine en grand, grille des 26 semaines */
.ph { position: relative; display: flex; align-items: center; gap: 16px; margin: 4px 0 16px; }
.anneau { width: 84px; height: 84px; flex: none; }
.a-fond { fill: none; stroke: var(--line); stroke-width: 8; }
.a-plein { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; }
.ph-c { position: absolute; left: 0; top: 0; width: 84px; height: 84px; display: flex; align-items: baseline; justify-content: center; padding-top: 28px; box-sizing: border-box; }
.ph-c b { font: 800 1.45rem var(--display); }
.ph-c small { color: var(--muted); font-weight: 600; }
.ph-t b { display: block; font: 600 1.15rem var(--display); }
.ph-t small { color: var(--muted); }
.pd { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.pd.cours { border-color: var(--accent); }
.pd-h { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: .85rem; }
.pd-h b { font: 800 1rem var(--display); color: var(--fg); }
.pd-sl { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 12px; }
.pd-sl b { font: 800 2.6rem/1 var(--display); color: var(--accent); }
.pd-sl small { color: var(--muted); font-weight: 600; }
.pd-ok { color: var(--rest); font-weight: 800; font-size: 1.4rem; }
.pd-t { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.pt { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.pt.ok { background: var(--rest-soft); border-color: var(--rest); }
.pt-i svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pt.ok .pt-i svg { stroke: var(--rest); }
.pt b { font: 800 1.15rem var(--display); }
.pt small { color: var(--muted); font-size: .78rem; font-weight: 600; }
.pg-t { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 18px 0 8px; }
.pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.sq { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; }
.sq small { font-size: .68rem; color: var(--muted); font-weight: 700; }
.sq b { font: 800 1.15rem var(--display); }
.sq.lg { border-style: dashed; }
.sq.ok { background: var(--rest-soft); border-color: var(--rest); }
.sq.ok b, .sq.ok small { color: var(--rest); }
.sq.ko { opacity: .55; }
.sq.encours { background: var(--accent); border-color: var(--accent); }
.sq.encours b, .sq.encours small { color: var(--on-color); }
.sq.sel { box-shadow: inset 0 0 0 2px var(--fg); } /* anneau à l'intérieur de la case : jamais coupé */
/* (ancien) Programme : frise */
.pilote { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.pilote .ghost { padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.pilote .ghost small { color: var(--muted); font-weight: 500; font-size: .82rem; }
.pilote .ghost.sure { background: #D63A2F; border-color: #D63A2F; color: #FFFFFF; }
.pilote .ghost.sure small { color: #FFFFFF; }
.phase-t { font-family: var(--display); font-weight: 600; font-size: 1.05rem; margin: 22px 0 8px; }
details.sem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; scroll-margin-top: 16px; }
details.sem[data-etat="encours"] { border: 2px solid var(--accent); background: var(--accent-soft); }
details.sem summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
details.sem summary::-webkit-details-marker { display: none; }
.sem-h { display: flex; align-items: baseline; gap: 8px; }
.sem-h b { font-family: var(--display); font-size: 1.05rem; }
.sem-h .dates { color: var(--muted); font-size: .85rem; flex: 1; min-width: 0; }
.etat { font-size: .78rem; font-weight: 700; white-space: nowrap; color: var(--muted); }
.etat.ok { color: var(--rest); }
.etat.encours { color: var(--accent); }
.sem-sl { font-size: .92rem; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: .74rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.badge.leg { background: var(--rest-soft); border-color: transparent; color: var(--rest); }
.sem-d { padding: 0 14px 14px; font-size: .9rem; }
.sem-d p { margin: 0 0 8px; }
.sem-d ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.graph { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.graph svg { display: block; width: 100%; height: auto; }
.graph .b-n { fill: var(--muted); opacity: .7; }
.graph .b-l { fill: var(--muted); opacity: .3; }
.graph .b-c { fill: var(--accent); }
.graph text { fill: var(--muted); font: 600 7px var(--body); }
.graph .axe { stroke: var(--line); stroke-width: 1; }

/* Bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav button { appearance: none; border: 0; background: none; color: var(--muted); font: 500 0.75rem var(--body); letter-spacing: 0.02em;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; min-width: 0; white-space: nowrap; }
nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); }

/* Timer */
#timer { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#timer[data-phase="effort"] { background: var(--accent-soft); }
#timer[data-phase="rest"] { background: var(--rest-soft); }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.t-top { flex-wrap: wrap; }
.t-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.t-son { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; }
.t-son label { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 10px; font-weight: 600; font-size: .95rem; }
.t-son input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); touch-action: none; }
.t-son output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.t-music { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .85rem; }
.t-music[aria-pressed="false"] { color: var(--muted); }
.t-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; min-height: 0; }
.t-phase { font-weight: 800; letter-spacing: 0.14em; font-size: 1rem; padding: 6px 14px; border-radius: 999px; background: var(--fg); color: var(--bg); }
#timer[data-phase="effort"] .t-phase { background: var(--accent); color: var(--on-color); }
#timer[data-phase="rest"] .t-phase { background: var(--rest); color: var(--on-color); }
.t-name { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 9vw, 3.2rem); line-height: 1.05; text-wrap: balance; margin: 8px 0 0; }
.t-photo { flex: none; height: min(20vh, 170px); aspect-ratio: 3 / 2; max-width: 100%; object-fit: contain; border-radius: 14px; background: #FFFFFF; }
@media (max-height: 560px) { .t-photo { display: none; } }
.t-time { font-family: var(--display); font-weight: 800; font-size: clamp(4.5rem, 26vw, 10rem); line-height: 1; font-variant-numeric: tabular-nums; }
.t-next { color: var(--muted); font-size: 1rem; }
.t-next b { color: var(--fg); }
.t-btns { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr; gap: 8px; }
.t-btns button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 16px 4px; font-weight: 600; font-size: 0.95rem; min-width: 0; }
.t-btns .main { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.t-confirm { display: flex; gap: 10px; }
.t-confirm button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 16px 8px; font-weight: 600; font-size: 1rem; }
.t-confirm #t-quit { background: var(--fg); color: var(--bg); border-color: var(--fg); }
/* Réactivité au toucher : retour visuel immédiat, animations sur le GPU uniquement (transform / opacity) */
button { transition: transform .08s ease-out, opacity .08s; }
button:active { transform: scale(.96); opacity: .85; }
.rond:active, .play:active { transform: scale(.9); }
.sheet:not([hidden]) { animation: monte .22s cubic-bezier(.2, .8, .3, 1); will-change: transform; }
.voile:not([hidden]) { animation: fondu .2s ease-out; }
@keyframes monte { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fondu { from { opacity: 0; } to { opacity: 1; } }
.carte-liste, .pd { contain: content; }
/* Changement d'onglet : le contenu arrive en douceur */
main > section:not([hidden]) { animation: arrive .22s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Séance cochée : la ligne glisse et s'efface avant de passer dans « Fait » */
.ls-row.partant { animation: part .26s ease-in forwards; }
@keyframes part { to { opacity: 0; transform: translateX(40px); } }
.rond.coche { animation: pop .26s ease-out; background: var(--rest); }
@keyframes pop { 50% { transform: scale(1.18); } }
/* Onglet actif : petite impulsion de l'icône */
nav button[aria-selected="true"] svg { animation: pop .3s ease-out; }
/* Feuille : on peut la descendre du doigt pour la fermer */
.sheet.glisse { animation: none; transition: none; }
.sheet.retour { transition: transform .2s ease-out; }
/* Barre de progression de l'étape du timer (fluide, seconde par seconde) */
.t-prog { width: min(260px, 70%); height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; margin: 6px auto 0; }
.t-prog i { display: block; height: 100%; width: 0; background: var(--fg); border-radius: 3px; }
#timer[data-phase="effort"] .t-prog i { background: var(--accent); }
#timer[data-phase="rest"] .t-prog i { background: var(--rest); }
.toast:not([hidden]) { animation: toastIn .22s cubic-bezier(.2, .8, .3, 1); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } button, .sheet, .voile, .toast, main > section, .ls-row, nav svg, .t-prog i { transition: none !important; animation: none !important; } }
</style>

  if (n > total) return { n: total, brut: n, total, statut: "fini", ligne: null };

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

function normaliser(e = etat) {

  e.majReglages = e.majReglages || {}; e.majSemaines = e.majSemaines || {}; // dates des modifications (absentes des anciennes données)

  for (const k in e.semaines) if (Array.isArray(e.semaines[k])) {

/* Fusion de l'état local (ce téléphone) et de celui du cloud, au lieu d'écraser.
   Chaque modification porte sa date (horloge du téléphone) :
   - majSemaines[semaine][activité] : date du dernier +1 / −1 (gardée même quand le compteur retombe à 0) ;
   - majReglages[activité] : date du dernier réglage ; majDernier : date du dernier changement de "dernier".
   Règle, pour chaque compteur / réglage / "dernier" : la valeur la plus récemment datée gagne (une date bat l'absence de date,
   donc un retrait daté gagne aussi). Sans date des deux côtés (anciennes données) : compteurs → le plus grand ;
   réglage présent d'un seul côté → on le garde ; sinon le côté dont "maj" (date globale) est le plus récent.
   Renvoie { etat, apport, change } : apport = le local apporte quelque chose au cloud (à renvoyer),
   change = le résultat diffère de l'état local (à réafficher). */
function fusionner(local, cloud) {
  const copie = o => normaliser(JSON.parse(JSON.stringify(o || {})));

  const localPlusRecent = (L.maj || "") > (C.maj || "");

  // choisit entre la valeur locale (vl, date dl) et celle du cloud (vc, dc) ; sansDate(vl, vc) décide quand aucune date
  function choisir(vl, dl, vc, dc, sansDate, egal) {
    let local;
    if (dl || dc) local = (dl || "") > (dc || "") ? true : (dc || "") > (dl || "") ? false : sansDate(vl, vc);
    else local = sansDate(vl, vc);
    const v = local ? vl : vc, d = (dl || "") > (dc || "") ? dl : (dc || dl || null);
    if (!egal(v, vc) || (d || null) !== (dc || null)) apport = true;  // le cloud n'a pas encore ça
    if (!egal(v, vl) || (d || null) !== (dl || null)) change = true;  // ce téléphone non plus
    return [v, d];
  }
  const memeJSON = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  // compteurs des semaines
  const semaines = {}, majSemaines = {};
  new Set([...Object.keys(L.semaines), ...Object.keys(C.semaines), ...Object.keys(L.majSemaines), ...Object.keys(C.majSemaines)]).forEach(k => {
    const a = L.semaines[k] || {}, b = C.semaines[k] || {}, da = L.majSemaines[k] || {}, db = C.majSemaines[k] || {};
    new Set([...Object.keys(a), ...Object.keys(b), ...Object.keys(da), ...Object.keys(db)]).forEach(id => {
      const [v, d] = choisir(+a[id] || 0, da[id], +b[id] || 0, db[id], (x, y) => x >= y, (x, y) => x === y);
      if (v > 0) (semaines[k] = semaines[k] || {})[id] = v;
      if (d) (majSemaines[k] = majSemaines[k] || {})[id] = d;
    });

  // réglages, activité par activité
  const reglages = {}, majReglages = {};
  new Set([...Object.keys(L.reglages), ...Object.keys(C.reglages)]).forEach(id => {
    const vl = L.reglages[id], vc = C.reglages[id];
    const sansDate = () => vc === undefined ? true : vl === undefined ? false : localPlusRecent;
    const [v, d] = choisir(vl, L.majReglages[id], vc, C.majReglages[id], sansDate, memeJSON);
    if (v !== undefined) reglages[id] = v;
    if (d) majReglages[id] = d;
  });

  const [dernier, majDernier] = choisir(L.dernier || null, L.majDernier, C.dernier || null, C.majDernier,
    (x, y) => y === null ? true : x === null ? false : localPlusRecent, (x, y) => x === y);
  const maj = localPlusRecent ? L.maj : (C.maj || L.maj || null);
  return { etat: { reglages, semaines, dernier, maj, majReglages, majSemaines, majDernier: majDernier || null }, apport, change };
}

  const r = await fetch(SB_URL + "/rest/v1/etat?id=eq." + SB_ID + "&select=data", { headers: SB_HEADERS, cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const rows = await r.json();
  return rows.length ? rows[0].data || {} : null;
}
function cloudPret() { return cloudOk; }
/* Envoi : on relit d'abord le cloud et on fusionne (un autre appareil a pu cocher entre-temps).
   sync() envoie toujours ; sync(false) n'envoie que si ce téléphone apporte quelque chose. */
function sync(toujours = true) {
  if (!cloudOk) return;
  const note = document.getElementById("save-note");
  cloudQueue = cloudQueue.then(async () => {
    const d = await lireCloud();
    const f = fusionner(etat, d || {});
    etat = f.etat; saveLocal();
    if (f.change) renderTout();
    if (toujours || f.apport || !d) await envoyer(donneesCloud());
  }).then(() => { note.hidden = true; }).catch(() => { note.hidden = false; });
}
async function connecterCloud() {
  const note = document.getElementById("save-note");
  const t = setTimeout(() => { note.hidden = false; }, 10000);
  try {
    const d = await lireCloud();
    clearTimeout(t);
    cloudOk = true;
    // fusion avec ce qui a pu être fait hors ligne sur ce téléphone (au lieu d'écraser)
    const f = fusionner(etat, d || {});
    etat = f.etat; saveLocal();
    if (f.apport || !d) cloudQueue = cloudQueue.then(() => envoyer(donneesCloud())).catch(() => { note.hidden = false; }); // première fois : on envoie ce qu'il y a sur ce téléphone
    note.hidden = true;
    renderTout();
  } catch (e) { clearTimeout(t); note.hidden = false; }
}

/* ---------- Outils ---------- */
function cfg(a) { return Object.assign({ effort: a.effort, recup: a.recup, tours: a.tours }, etat.reglages[a.id] || {}); }
function lundi(d = new Date()) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

const complet = a => nbFait(a.id) >= Math.max(1, objectif(a));

  const c = cfg(a), n = a.exos.length * c.tours;
  return a.exos.reduce((s, e) => s + dureeExo(a, e), 0) * c.tours + (n - 1) * c.recup;
}
function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return s ? m + " min " + String(s).padStart(2,"0") : m + " min"; }
const meta = a => a.type === "sortie" ? infoAct(a) : fmt(dureeSec(a));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function ajouter(id, delta) {
  const k = cleSemaine(), s = Object.assign({}, etat.semaines[k] || {});
  s[id] = Math.max(0, (s[id] || 0) + delta);
  if (!s[id]) delete s[id];

  const maintenant = new Date().toISOString();

  if (!b.classList.contains("sure")) {
    document.querySelectorAll(".del.sure").forEach(x => { x.classList.remove("sure"); x.textContent = libelleDel(x); });

});
document.addEventListener("visibilitychange", () => { if (run && !document.hidden) { garderEcran(); try { audio && audio.resume(); } catch (e) {} } });
T("timer").addEventListener("pointerdown", () => { try { audio && audio.state !== "running" && audio.resume(); } catch (e) {} });

/* ---------- Navigation ---------- */
const TABS = ["aujourdhui", "programme"];
// Chaque onglet garde sa position de défilement : on retrouve la page là où on l'avait laissée
const positions = {}; let ongletActif = null;
function show(name) {
  if (!TABS.includes(name)) name = "aujourdhui";
  fermerRegl();
  if (ongletActif) positions[ongletActif] = window.scrollY;
  document.querySelectorAll("[data-tab]").forEach(s => s.hidden = s.dataset.tab !== name);
  document.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-selected", b.dataset.go === name));
  try { localStorage.setItem("tab", name); } catch (e) {}
  if (name === "programme") allerSemaineCourante(); else renderAujourdhui(); // l'onglet ouvert est redessiné à jour
  if (name !== ongletActif) window.scrollTo(0, positions[name] || 0);
  ongletActif = name;
}
document.addEventListener("click", e => {
  if (e.target.id === "voile") { fermerRegl(); return; }
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go) show(d.go);
  else if (d.start) { fermerRegl(); lancer(d.start); }
  else if (d.done) { // petit « pop » vert, la ligne glisse, puis la liste se met à jour
    decalage = 0; const ligneEl = b.closest(".ls-row"), id = d.done;
    if (ligneEl && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      b.classList.add("coche"); b.disabled = true;
      setTimeout(() => ligneEl.classList.add("partant"), 140);
      setTimeout(() => ajouter(id, 1), 400);
    } else ajouter(id, 1);
  }
  else if (d.del || d.moins) retirer(b);
  else if (d.regl) ouvrirRegl(d.regl);
  else if (d.fermer) fermerRegl();
  else if (d.adj) ajuster(d.adj, +d.d);
  else if (d.sem) ouvrirSemaine(+d.sem); // la page ne bouge pas
});
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerRegl(); });
// Feuille de réglages : on la descend du doigt pour la fermer (écouteurs passifs : le défilement reste fluide)
(() => {
  const sh = document.getElementById("sh-regl"); let y0 = null, dy = 0;
  sh.addEventListener("touchstart", e => { if (sh.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; sh.classList.add("glisse"); }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = dy ? `translateY(${dy}px)` : ""; }, { passive: true });
  sh.addEventListener("touchend", () => {
    if (y0 === null) return; y0 = null; sh.classList.remove("glisse");
    if (dy > 90) { sh.style.transform = ""; fermerRegl(); return; }
    sh.classList.add("retour"); sh.style.transform = ""; setTimeout(() => sh.classList.remove("retour"), 220);
  }, { passive: true });
})();

// Pas de zoom à deux doigts (iPhone)
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
// (plus d'écouteur touchstart/touchmove bloquant : il forçait iOS à attendre le script avant chaque défilement)
let dernierTap = 0; // pas de zoom au double-tap
document.addEventListener("touchend", e => {
  const t = Date.now();
  if (t - dernierTap < 350 && !e.target.closest("button")) e.preventDefault();
  dernierTap = t;
}, { passive: false });

/* Sauvegarde en ligne : connexion au démarrage, puis resynchronisation quand l'app revient au premier plan
   ou que le réseau revient (réessaie aussi une app démarrée hors ligne). */
let connexionEnCours = false;
function reconnecter() {
  if (cloudPret()) { sync(false); return; }
  if (connexionEnCours) return;
  connexionEnCours = true;
  Promise.resolve().then(connecterCloud).catch(() => {}).then(() => { connexionEnCours = false; });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) reconnecter(); });
window.addEventListener("online", reconnecter);

renderTout();
reconnecter();
let saved = null; try { saved = localStorage.getItem("tab"); } catch (e) {}
show(saved || "aujourdhui");
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
</script>
